<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REAPER Remote (with timeline)</title>
<style>
:root{
  --bg:#171b22; --panel:#212733; --edge:#323a4a; --text:#e2e8f2; --dim:#8591a6;
  --go:#3fd0a8; --rec:#ef4d55; --mute:#f0bf3a; --solo:#4ea6ff; --cap:#e9edf4;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body{padding:12px;max-width:1100px;margin:0 auto;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.fader:focus-visible{outline:2px solid var(--solo);outline-offset:2px}

header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:10px 14px}
.transport{display:flex;gap:6px}
.t{width:58px;height:54px;border-radius:8px;border:1px solid var(--edge);background:#2a3140;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.t span{font-size:11px;color:var(--dim)} .t.on span{color:inherit}
.t svg{width:18px;height:18px;fill:currentColor}
.t:active{transform:translateY(1px)}
.t.on{background:var(--go);color:#07241c;border-color:var(--go)}
#b-record{color:var(--rec)} #b-record.on{background:var(--rec);color:#fff;border-color:var(--rec)}
.readout{margin-left:auto;text-align:right}
#time{font:600 30px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.02em}
#beat{color:var(--dim);font:13px ui-monospace,Menlo,Consolas,monospace}
.opts{display:flex;gap:6px}
.opts .t{width:auto;padding:0 12px;height:34px;font-size:13px;flex-direction:row}
#status{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
#status i{width:9px;height:9px;border-radius:50%;background:var(--rec);display:inline-block}
#status.ok i{background:var(--go)}

.tlbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 6px;color:var(--dim);font-size:12px}
.tlbar button,.tlbar select,.filebtn{background:#2a3140;border:1px solid var(--edge);border-radius:6px;color:var(--text);padding:5px 10px;font:inherit;cursor:pointer}
.tlbar label{display:flex;align-items:center;gap:5px}
#tl{position:relative;overflow:auto;max-height:70vh;background:#10141a;border:1px solid var(--edge);border-radius:10px}
#sizer{position:absolute;top:0;left:0;height:1px;pointer-events:none}
#cv{position:sticky;left:0;display:block;touch-action:none;cursor:text}
#mixer{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scroll-snap-type:x proximity}
.strip{flex:1 0 112px;max-width:150px;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;scroll-snap-align:start}
.strip.sel{border-color:var(--solo)}
.name{width:100%;text-align:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;min-height:20px}
.pan{width:100%}
.pan input{width:100%;accent-color:var(--solo)}
.pan span{display:block;text-align:center;color:var(--dim);font-size:11px}
.btns{display:flex;gap:4px}
.btns button{width:32px;height:30px;border-radius:6px;border:1px solid var(--edge);background:#2a3140;font-weight:700;font-size:12px}
.btns .m.on{background:var(--mute);color:#2a2000;border-color:var(--mute)}
.btns .s.on{background:var(--solo);color:#041a33;border-color:var(--solo)}
.btns .r.on{background:var(--rec);color:#fff;border-color:var(--rec)}
.chan{display:flex;gap:8px;height:240px}
.vu{display:none;width:10px;background:#10141a;border-radius:3px;position:relative;overflow:hidden}
.vu b{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(to top,var(--go) 0 65%,var(--mute) 65% 88%,var(--rec) 88%);transition:height .06s linear}
.fader{width:44px;background:#10141a;border-radius:6px;position:relative;touch-action:none;cursor:ns-resize}
.fader::before{content:"";position:absolute;left:50%;top:10px;bottom:10px;width:3px;margin-left:-1.5px;background:#38425a;border-radius:2px}
.cap{position:absolute;left:3px;right:3px;height:26px;margin-top:-13px;background:var(--cap);border-radius:4px;box-shadow:0 2px 0 #9aa4b6}
.cap::after{content:"";position:absolute;left:6px;right:6px;top:12px;height:2px;background:#2a3140}
.db{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--dim)}

.actions{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions input{background:#10141a;border:1px solid var(--edge);border-radius:6px;color:var(--text);padding:7px 10px;font:inherit;min-width:0;flex:1 1 200px}
.actions button{padding:7px 14px;border-radius:6px;border:1px solid var(--edge);background:#2a3140}
#log{flex-basis:100%;color:var(--dim);font:12px ui-monospace,Menlo,Consolas,monospace;min-height:1.4em}
@media (prefers-reduced-motion:reduce){.vu b{transition:none}}
/* track rows */
#mixer{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));overflow:visible;scroll-snap-type:none}
.strip{flex:none;max-width:none;flex-direction:row;align-items:center;gap:8px;padding:6px 8px 6px 14px;min-height:58px}
.name{flex:1;width:auto;text-align:left;font-size:15px;min-height:0;padding:12px 0}
.btns{gap:6px}
.btns button{width:48px;height:44px;font-size:15px;border-radius:8px}
@media (max-width:640px){
  body{padding:8px}
  header{padding:8px}
  .transport{width:100%;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .transport .t{width:auto;height:52px}
  .readout{margin-left:0;text-align:left;flex:1}
  #time{font-size:26px}
  .opts .t{height:40px}
  .tlbar{gap:6px}
  .tlbar button,.tlbar select,.filebtn{padding:8px 12px}
  #tlmsg{flex-basis:100%}
  #mixer{grid-template-columns:1fr}
  .actions input{flex-basis:100%}
}
#barin{width:80px;background:#10141a;border:1px solid var(--edge);border-radius:6px;color:var(--text);padding:5px 8px;font:inherit}
@media (max-width:640px){#barin{padding:8px 10px;width:90px}}
.ticon{width:28px;height:28px;object-fit:contain;border-radius:5px;flex:none}
.strip.ishidden{opacity:.5}
.btns .h{width:40px;background:transparent;display:grid;place-items:center;padding:0}
</style>
</head>
<body>
<header>
  <div class="transport">
    <button class="t" id="b-rewind" title="Go to start"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg><span>Start</span></button>
    <button class="t" id="b-back" title="Back 5 seconds"><svg viewBox="0 0 24 24"><path d="M11 6v12L2 12zM22 6v12l-9-6z"/></svg><span>-5s</span></button>
    <button class="t" id="b-stop" title="Stop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"/></svg><span>Stop</span></button>
    <button class="t" id="b-play" title="Play (Space)"><svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg><span>Play</span></button>
    <button class="t" id="b-pause" title="Pause"><svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg><span>Pause</span></button>
    <button class="t" id="b-record" title="Record"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg><span>Record</span></button>
    <button class="t" id="b-fwd" title="Forward 5 seconds"><svg viewBox="0 0 24 24"><path d="M13 6v12l9-6zM2 6v12l9-6z"/></svg><span>+5s</span></button>
  </div>
  <div class="opts">
    <button class="t" id="b-repeat">Loop</button>
    <button class="t" id="b-click">Metronome</button>
  </div>
  <div class="readout"><div id="time">0:00.000</div><div id="beat">1.1.00</div></div>
  <div id="status"><i></i><span>Connecting</span></div>
</header>

<div class="tlbar">
  <button id="zout" aria-label="Zoom out">-</button><span id="zoomlbl">20 px/s</span><button id="zin" aria-label="Zoom in">+</button>
  <input type="text" id="barin" inputmode="decimal" placeholder="Bar" aria-label="Jump to bar, or bar.beat">
  <button id="bargo">Go to bar</button>
  <label><input type="checkbox" id="follow" checked> Follow playhead</label>
  <select id="lanesel" aria-label="Track for loaded audio"></select>
  <button id="wave">Reload waveforms</button>
  <label class="filebtn">Load audio<input type="file" id="file" accept="audio/*" multiple hidden></label>
  <span id="tlmsg">The timeline shows rec-armed tracks. Tap or drag it to set the position, then press Play or Record. Two fingers pan and pinch to zoom.</span>
</div>
<div id="tl"><div id="sizer"></div><canvas id="cv"></canvas></div>

<div class="tlbar"><label><input type="checkbox" id="showmuted"> Show muted tracks</label><label><input type="checkbox" id="showhidden"> Show hidden tracks</label><button id="unhideall">Unhide all</button><span id="mixmsg"></span></div>
<div id="mixer" aria-label="Mixer"></div>

<div class="actions">
  <input id="action" placeholder="Action ID (e.g. 40029) or named command (e.g. _SWS_SAVEALL)" aria-label="Action ID or named command">
  <button id="run">Run action</button>
  <div id="log">Waiting for REAPER…</div>
</div>

<script>

// ---------- REAPER web interface (HTTP) ----------
const $ = id => document.getElementById(id);
const UNITY = 0.716;                         // fader position of 0 dB
const faderToGain = p => p <= 0 ? 0 : Math.pow(10, (p <= UNITY ? -60 + p / UNITY * 60 : (p - UNITY) / (1 - UNITY) * 12) / 20);
const gainToFader = g => { if (g < 0.001) return 0; const d = 20 * Math.log10(g); return Math.min(1, d <= 0 ? Math.max(0, UNITY * (d + 60) / 60) : UNITY + d / 12 * (1 - UNITY)); };
const ACT = {'/play':1007, '/stop':1016, '/pause':1008, '/record':1013};
function send(addr, ...v) {
  const x = v[0]; let c = null, m;
  if (ACT[addr]) c = ACT[addr];
  else if (addr === '/repeat') c = `SET/REPEAT/${x}`;
  else if (addr === '/click') c = 41745;                       // Options: Toggle metronome
  else if (addr === '/time') c = `SET/POS/${x}`;
  else if (addr === '/action') c = x.i;
  else if (addr === '/action/str') c = encodeURIComponent(x);
  else if (m = addr.match(/^\/track\/(\d+)\/(\w+)$/)) {
    const k = {select:'SEL', pan:'PAN', mute:'MUTE', solo:'SOLO', recarm:'RECARM', volume:'VOL'}[m[2]];
    const val = m[2] === 'pan' ? x * 2 - 1 : m[2] === 'volume' ? faderToGain(x) : x;
    if (k) c = `SET/TRACK/${m[1]}/${k}/${val}`;
  }
  if (c !== null) fetch('/_/' + c, {cache:'no-store'}).catch(() => {});
}
function setStatus(ok){ $('status').className = ok ? 'ok' : ''; $('status').lastChild.textContent = ok ? 'Connected to REAPER' : 'Can\'t reach REAPER'; }

// ---------- state ----------
const state = { repeat:0, click:0, tracks: [] };
let lastMsg = 0;

// ---------- track colours + icons ----------
let swapRB = false;
const nativeRGB = n => (n & 0x1000000) ? (swapRB ? [(n >> 16) & 255, (n >> 8) & 255, n & 255] : [n & 255, (n >> 8) & 255, (n >> 16) & 255]) : null;
const trackColor = T => { const c = nativeRGB(T.native || 0); return c ? `rgb(${c})` : (T.xcolor || null); };
const hexRGB = h => [1, 3, 5].map(k => parseInt(h.substr(k, 2), 16));
function calib(T) {   // learn REAPER's channel order by comparing live and exported colour of one track
  const n = T.native || 0; if (swapRB || !T.xcolor || !(n & 0x1000000)) return;
  const e = hexRGB(T.xcolor), a = [n & 255, (n >> 8) & 255, (n >> 16) & 255];
  if (e.join() === [a[2], a[1], a[0]].join() && e.join() !== a.join()) swapRB = true;
}

// ---------- hiding tracks (remembered in this browser) ----------
const hidden = new Set(); try { JSON.parse(localStorage.getItem('rr-hidden') || '[]').forEach(i => hidden.add(i)); } catch {}
const saveHidden = () => { try { localStorage.setItem('rr-hidden', JSON.stringify([...hidden])); } catch {} };
const EYE = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>';
function updateMsg() {
  const n = state.tracks.length, h = [...hidden].filter(i => i < n).length;
  const m = state.tracks.filter((t, i) => t.mute && !hidden.has(i)).length, out = [];
  let tot = 0;
  if (m && !$('showmuted').checked) { out.push(`${m} muted`); tot += m; }
  if (h && !$('showhidden').checked) { out.push(`${h} hidden`); tot += h; }
  $('mixmsg').textContent = out.length ? `${out.join(' + ')}: ${tot} track${tot > 1 ? 's' : ''} not shown` : '';
}

// ---------- mixer UI ----------
const mixer = $('mixer'), strips = [];
function addStrip(i) {
  const n = i + 1, el = document.createElement('div');
  el.className = 'strip';
  el.innerHTML = `<img class="ticon" alt="" hidden><div class="name" role="button" title="Select track"></div>
    <div class="btns"><button class="m" aria-label="Mute track ${n}">M</button><button class="s" aria-label="Solo track ${n}">S</button><button class="r" aria-label="Record arm track ${n}">R</button><button class="h"></button></div>`;
  mixer.appendChild(el);
  const q = x => el.querySelector(x), s = {el, img:q('.ticon'), name:q('.name'), m:q('.m'), s:q('.s'), r:q('.r'), h:q('.h')};
  strips.push(s);
  const T = state.tracks[i];
  s.name.onclick = () => send(`/track/${n}/select`, 1);
  for (const [k, key] of [['m','mute'],['s','solo'],['r','rec']]) {
    const addr = {mute:'mute', solo:'solo', rec:'recarm'}[key];
    s[k].onclick = () => { T[key] = T[key] ? 0 : 1; send(`/track/${n}/${addr}`, T[key]); draw(i); dirty = true; };
  }
  s.h.onclick = () => { hidden.has(i) ? hidden.delete(i) : hidden.add(i); saveHidden(); draw(i); updateMsg(); dirty = true; };
  draw(i);
}
function draw(i) {
  const s = strips[i], T = state.tracks[i];
  s.m.classList.toggle('on', !!T.mute); s.s.classList.toggle('on', !!T.solo); s.r.classList.toggle('on', !!T.rec);
  s.el.classList.toggle('sel', !!T.sel);
  const hid = hidden.has(i);
  s.el.style.display = ((T.mute && !$('showmuted').checked) || (hid && !$('showhidden').checked)) ? 'none' : '';
  s.el.classList.toggle('ishidden', hid);
  if (s.h.dataset.hid !== String(hid)) { s.h.dataset.hid = String(hid); s.h.innerHTML = hid ? EYE : EYE_OFF; }
  s.h.title = s.h.ariaLabel = `${hid ? 'Unhide' : 'Hide'} track ${i + 1}`;
  s.name.textContent = T.name || `Track ${i + 1}`;
  const col = trackColor(T); s.el.style.borderLeft = col ? `6px solid ${col}` : '';
  const u = T.img ? T.img.src : ''; if (s.img.dataset.u !== u) { s.img.dataset.u = u; if (u) s.img.src = u; } s.img.hidden = !u;
}

// ---------- polling REAPER ----------
function parse(line) {
  const f = line.split('\t');
  if (f[0] === 'TRANSPORT') {
    const ps = +f[1];
    $('b-play').classList.toggle('on', ps === 1 || ps === 5);
    $('b-stop').classList.toggle('on', ps === 0);
    $('b-pause').classList.toggle('on', ps === 2 || ps === 6);
    $('b-record').classList.toggle('on', ps === 5 || ps === 6);
    state.playing = ps === 1 || ps === 5;
    state.repeat = +f[3]; $('b-repeat').classList.toggle('on', state.repeat > 0);
    if (!scrubbing) { state.time = +f[2]; $('time').textContent = f[4]; }
    $('beat').textContent = f[5] || '';
  } else if (f[0] === 'TRACK') {
    const i = +f[1] - 1; if (i < 0) return;
    ensureTracks(i + 1); window._seen = i + 1; const T = state.tracks[i];
    const fl = +f[3], g = +f[4];
    T.name = f[2]; T.native = +f[13] || 0; calib(T); T.sel = fl & 2 ? 1 : 0; T.mute = fl & 8 ? 1 : 0; T.solo = fl & 16 ? 1 : 0; T.rec = fl & 64 ? 1 : 0;
    draw(i);
  }
}
async function poll() {
  try {
    const r = await fetch('/_/TRANSPORT;TRACK', {cache:'no-store'});
    if (!r.ok) throw 0;
    let seen = 0; window._seen = 0;
    (await r.text()).split('\n').forEach(parse);
    trimTracks(window._seen);
    updateMsg();
    lastMsg = Date.now(); dirty = true; setStatus(true);
  } catch { setStatus(false); }
  setTimeout(poll, 100);
}

// ---------- timeline + waveforms ----------
const LANE = 48, RULER = 22, PEAK_RATE = 200;
const tl = $('tl'), cv = $('cv'), sizer = $('sizer'), ctx = cv.getContext('2d');
let pps = 20, dirty = true, scrubbing = false, lastSent = 0, lastW = 0;
state.time = 0; state.playing = false;
const lanes = [];
const fmt = t => `${Math.floor(t/60)}:${(t%60).toFixed(t % 1 ? 1 : 0).padStart(t % 60 < 10 ? 2 : 1, '0')}`;
const fmtMs = t => `${Math.floor(t/60)}:${(t%60).toFixed(3).padStart(6,'0')}`;
const duration = () => Math.max(60, state.time + 30, ...lanes.flatMap(l => l.items.map(it => it.pos + it.len + 5)));
const layout = () => { lastW = Math.ceil(duration() * pps); sizer.style.width = lastW + 'px'; };

function seek(t, force) {
  state.time = t; dirty = true; $('time').textContent = fmtMs(t);
  const n = performance.now();
  if (force || n - lastSent > 40) { lastSent = n; send('/time', t); }
}
const tAt = e => Math.max(0, (tl.scrollLeft + e.clientX - tl.getBoundingClientRect().left) / pps);
const ptrs = new Map(); let gest = null, pending = false, startX = 0;
cv.onpointerdown = e => {
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, e.clientX);
  if (ptrs.size === 2) { const [p, q] = [...ptrs.values()]; gest = {d: Math.abs(p - q) || 1, mid: (p + q) / 2}; scrubbing = pending = false; return; }
  if (e.pointerType === 'touch') { pending = true; startX = e.clientX; return; }   // wait: may become a two-finger gesture
  scrubbing = true; seek(tAt(e), true);
};
cv.onpointermove = e => {
  if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, e.clientX);
  if (ptrs.size === 2 && gest) {
    const [p, q] = [...ptrs.values()], d = Math.abs(p - q) || 1, mid = (p + q) / 2;
    zoom(d / gest.d, mid - tl.getBoundingClientRect().left); tl.scrollLeft -= mid - gest.mid; gest = {d, mid}; return;
  }
  if (pending && Math.abs(e.clientX - startX) > 6) { pending = false; scrubbing = true; }
  if (scrubbing) seek(tAt(e));
};
const endPtr = e => {
  if (pending && ptrs.size === 1) seek(tAt(e), true);   // a tap
  pending = false; ptrs.delete(e.pointerId); gest = null;
  if (scrubbing) { scrubbing = false; send('/time', state.time); }
};
cv.onpointerup = endPtr; cv.onpointercancel = endPtr;

function zoom(f, ax) {
  ax = ax ?? tl.clientWidth / 2;
  const t = (tl.scrollLeft + ax) / pps;
  pps = Math.min(200, Math.max(2, pps * f)); layout();
  tl.scrollLeft = t * pps - ax; dirty = true; $('zoomlbl').textContent = Math.round(pps) + ' px/s';
}
$('zin').onclick = () => zoom(1.4); $('zout').onclick = () => zoom(1/1.4);
cv.addEventListener('wheel', e => { if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoom(e.deltaY < 0 ? 1.15 : 1/1.15, e.clientX - tl.getBoundingClientRect().left); } }, {passive:false});
tl.addEventListener('scroll', () => dirty = true);
new ResizeObserver(() => dirty = true).observe(tl);

const visTracks = () => state.tracks.map((t, i) => t.rec && !hidden.has(i) ? i : -1).filter(i => i >= 0);
const laneH = () => { const n = visTracks().length; return n <= 1 ? 140 : n <= 3 ? 90 : LANE; };
function drawTL() {
  dirty = false;
  const vis = visTracks(), LH = laneH(), dpr = window.devicePixelRatio || 1, W = tl.clientWidth, H = RULER + Math.max(1, vis.length) * LH, sx = tl.scrollLeft;
  if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px'; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#10141a'; ctx.fillRect(0, 0, W, H);
  const step = [1,2,5,10,15,30,60,120,300,600,1800].find(v => v * pps >= 80) || 3600;
  ctx.font = '11px ui-monospace,Menlo,Consolas,monospace'; ctx.textBaseline = 'middle';
  for (let t = Math.floor(sx / pps / step) * step; t * pps - sx < W; t += step) {
    const x = Math.round(t * pps - sx) + .5;
    ctx.fillStyle = '#323a4a'; ctx.fillRect(x, RULER - 6, 1, H); ctx.fillStyle = '#8591a6'; ctx.fillText(fmt(t), x + 4, RULER / 2);
  }
  if (!vis.length) { ctx.fillStyle = '#8591a6'; ctx.fillText('Arm a track (R) to see its waveform here', 12, RULER + LH / 2); }
  vis.forEach((ti, r) => {
    const L = lanes[ti], top = RULER + r * LH, mid = top + LH / 2, amp = LH / 2 - 6;
    if (r % 2) { ctx.fillStyle = '#151a23'; ctx.fillRect(0, top, W, LH); }
    for (const it of L.items) {
      const x0 = it.pos * pps - sx, x1 = (it.pos + it.len) * pps - sx; if (x1 < 0 || x0 > W) continue;
      const col = trackColor(state.tracks[ti]) || '#4ea6ff';
      ctx.globalAlpha = .16; ctx.fillStyle = col; ctx.fillRect(x0, top + 2, x1 - x0, LH - 4); ctx.globalAlpha = 1; ctx.fillStyle = col;
      for (let px = Math.max(0, Math.floor(x0)); px < Math.min(W, x1); px++) {
        const a = Math.max(0, Math.floor((sx + px - it.pos * pps) / pps * it.rate)); if (a >= it.n) break;
        const b = Math.min(it.n, Math.max(a + 1, Math.ceil((sx + px + 1 - it.pos * pps) / pps * it.rate)));
        let lo = 0, hi = 0; for (let k = a; k < b; k++) { if (it.mn[k] < lo) lo = it.mn[k]; if (it.mx[k] > hi) hi = it.mx[k]; }
        ctx.fillRect(px, mid - hi * amp, 1, Math.max(1, (hi - lo) * amp));
      }
    }
    const T = state.tracks[ti], lc = trackColor(T); let lx = 8;
    if (lc) { ctx.fillStyle = lc; ctx.fillRect(0, top + 2, 4, LH - 4); }
    if (T.img && T.img.complete && T.img.naturalWidth) { ctx.drawImage(T.img, 8, top + 3, 16, 16); lx = 28; }
    ctx.fillStyle = 'rgba(226,232,242,.85)'; ctx.fillText(T.name || `Track ${ti+1}`, lx, top + 11);
  });
  const x = Math.round(state.time * pps - sx) + .5;
  ctx.fillStyle = '#3fd0a8'; ctx.fillRect(x - .5, 0, 2, H);
  ctx.beginPath(); ctx.moveTo(x - 6, 0); ctx.lineTo(x + 7, 0); ctx.lineTo(x + .5, 9); ctx.fill();
}
function frame() {
  if (Math.ceil(duration() * pps) !== lastW) layout();
  if ($('follow').checked && state.playing && !scrubbing) {
    const x = state.time * pps - tl.scrollLeft;
    if (x > tl.clientWidth - 30 || x < 0) tl.scrollLeft = Math.max(0, state.time * pps - 40);
  }
  if (dirty || state.playing) drawTL();
  requestAnimationFrame(frame);
}

// waveform source: audio files decoded in the browser (OSC can't carry audio)
const AC = new (window.AudioContext || window.webkitAudioContext)();
async function loadAudio(file, lane) {
  $('tlmsg').textContent = `Decoding ${file.name}...`;
  try {
    const buf = await AC.decodeAudioData(await file.arrayBuffer());
    const n = Math.ceil(buf.duration * PEAK_RATE), mn = new Float32Array(n), mx = new Float32Array(n), spp = buf.sampleRate / PEAK_RATE;
    const ch = Array.from({length: buf.numberOfChannels}, (_, c) => buf.getChannelData(c));
    for (let p = 0; p < n; p++) {
      let lo = 0, hi = 0; const a = Math.floor(p * spp), b = Math.min(buf.length, Math.floor((p + 1) * spp));
      for (const d of ch) for (let i = a; i < b; i++) { const v = d[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
      mn[p] = lo; mx[p] = hi;
    }
    lanes[lane] = {items: [{pos:0, len:buf.duration, rate:PEAK_RATE, n, mn, mx}]};
    layout(); dirty = true; $('tlmsg').textContent = `${file.name} on track ${lane + 1}, drawn from 0:00.`;
  } catch { $('tlmsg').textContent = `Couldn't decode ${file.name}. Try WAV, MP3, FLAC or OGG.`; }
}
$('file').onchange = e => { [...e.target.files].forEach((f, i) => { const l = +$('lanesel').value + i; if (l < lanes.length) loadAudio(f, l); }); e.target.value = ''; };
tl.ondragover = e => e.preventDefault();
tl.ondrop = e => {
  e.preventDefault();
  const y = e.clientY - cv.getBoundingClientRect().top;
  const first = y < RULER ? +$('lanesel').value : visTracks()[Math.floor((y - RULER) / laneH())];
  if (first === undefined) return;
  [...e.dataTransfer.files].forEach((f, i) => { if (first + i < lanes.length) loadAudio(f, first + i); });
};
function ensureTracks(n) {
  while (state.tracks.length < n) {
    const i = state.tracks.length;
    state.tracks.push({vol:UNITY, pan:.5, mute:0, solo:0, rec:0, sel:0, name:'', db:'0.0', vu:0});
    lanes.push({items: []}); addStrip(i); $('lanesel').add(new Option(`Load into track ${i+1}`, i));
  }
}
function trimTracks(n) {
  while (state.tracks.length > n) { state.tracks.pop(); lanes.pop(); strips.pop().el.remove(); $('lanesel').remove($('lanesel').length - 1); dirty = true; }
}
async function loadWaves() {
  $('tlmsg').textContent = 'Loading waveforms...';
  try {
    const r = await fetch('/waveforms.json', {cache:'no-store'}); if (!r.ok) throw 0;
    const j = await r.json(); let count = 0;
    ensureTracks(Math.max(0, ...j.tracks.map(t => t.idx)));
    for (const t of j.tracks) lanes[t.idx - 1].items = t.items.map(it => { count++; return {pos:it.pos, len:it.len, rate:j.rate, n:it.mn.length,
      mn:Float32Array.from(it.mn, v => v / 127), mx:Float32Array.from(it.mx, v => v / 127)}; });
    for (const t of j.tracks) {
      const T = state.tracks[t.idx - 1]; T.xcolor = t.color || null;
      if (t.icon && T.icon !== t.icon) { T.icon = t.icon; T.img = new Image(); T.img.onload = () => { dirty = true; draw(t.idx - 1); }; T.img.src = t.icon + '?' + Date.now(); }
      if (!t.icon) { T.icon = T.img = null; }
      calib(T);
    }
    state.tracks.forEach((_, i) => draw(i));
    layout(); dirty = true; $('tlmsg').textContent = `Loaded waveforms for ${count} items.`;
  } catch { $('tlmsg').textContent = 'No waveforms yet. Run export_waveforms.lua in REAPER, then click Reload waveforms.'; }
}
$('wave').onclick = loadWaves;
function gotoBar() {
  const m = $('barin').value.trim().match(/^(\d+)(?:[.:](\d+))?$/);
  if (!m || +m[1] < 1) { $('tlmsg').textContent = 'Type a bar number like 17, or bar.beat like 17.3'; return; }
  fetch(`/_/SET/POS_STR/${+m[1]}.${+m[2] || 1}.00`, {cache:'no-store'}).catch(() => {});
  $('tlmsg').textContent = `Jumped to bar ${m[1]}${m[2] ? ' beat ' + m[2] : ''}`;
  setTimeout(() => { const x = state.time * pps - tl.scrollLeft; if (x < 0 || x > tl.clientWidth) tl.scrollLeft = Math.max(0, state.time * pps - 60); }, 300);
}
$('bargo').onclick = gotoBar;
$('barin').onkeydown = e => { if (e.key === 'Enter') gotoBar(); };
const redrawAll = () => { state.tracks.forEach((_, i) => draw(i)); updateMsg(); dirty = true; };
$('showmuted').onchange = $('showhidden').onchange = redrawAll;
$('unhideall').onclick = () => { hidden.clear(); saveHidden(); redrawAll(); };
layout(); requestAnimationFrame(frame);

// ---------- transport + actions ----------
for (const k of ['play','stop','pause','record']) $('b-'+k).onclick = () => send('/'+k, 1);
$('b-rewind').onclick = () => seek(0, true);
$('b-back').onclick = () => seek(Math.max(0, state.time - 5), true);
$('b-fwd').onclick = () => seek(state.time + 5, true);
$('b-repeat').onclick = () => send('/repeat', state.repeat ? 0 : 1);
$('b-click').onclick = () => send('/click', state.click ? 0 : 1);
function runAction(){
  const v = $('action').value.trim(); if (!v) return;
  if (/^\d+$/.test(v)) send('/action', {i:+v}); else send('/action/str', v);
  $('log').textContent = `Sent ${/^\d+$/.test(v) ? 'action ' : 'command '}${v}`;
}
$('run').onclick = runAction;
$('action').onkeydown = e => { if (e.key === 'Enter') runAction(); };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  if (e.code === 'Space') { e.preventDefault(); send('/play', 1); }
});
setInterval(() => { $('log').textContent = Date.now() - lastMsg < 3000 ? 'Connected to REAPER' : ($('log').textContent.startsWith('Sent') ? $('log').textContent : 'No answer from REAPER. Is the web interface enabled in Preferences?'); }, 1500);
loadWaves(); poll();
</script>
